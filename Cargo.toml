[package]
name = "flyrag"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Retrieval that learns from verified usefulness, built on the fly mushroom body: sparse KC codes, opposing use/skip readout banks, bounded prediction-error updates; a learning re-ranker over any retriever."
keywords = ["retrieval", "rag", "reranking", "continual-learning", "bio-inspired"]
categories = ["algorithms", "text-processing"]
readme = "README.md"
publish = false # the operator decides on crates.io publication

[workspace]
members = [".", "bench"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# kenyon is public (github.com/coleleavitt/kenyon). Pinned by rev — bump
# deliberately; kenyon's RNG constants are a bit-level stability surface
# (see its README) that persisted downstream state depends on.
kenyon = { git = "https://github.com/coleleavitt/kenyon.git", rev = "1a29b994a16ea3f54f613f30dd7a5112d18cdb24" }

[lints]
workspace = true

[features]
# Round-trip the state-bearing types (`FlyRag`, `Banks`, `RagParams`,
# `TextEncoder`, `KcCode`, `FlyHash`, `FlyBloom`, `FlyIndex`) through
# serde — downstream picks the format (bincode/postcard/json).
serde = ["dep:serde", "kenyon/serde"]

[dependencies]
kenyon = { workspace = true }
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
