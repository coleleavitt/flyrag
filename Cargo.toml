[package]
name = "flyrag"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Retrieval that learns from verified usefulness, built on the fly mushroom body: sparse KC codes, opposing use/skip readout banks, bounded prediction-error updates; a learning re-ranker over any retriever."
keywords = ["retrieval", "rag", "reranking", "continual-learning", "bio-inspired"]
categories = ["algorithms", "text-processing"]
readme = "README.md"
publish = false # the operator decides on crates.io publication

[workspace]
members = [".", "bench"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# kenyon is a private repo until it is published; pinned by rev. Bump it deliberately.
kenyon = { git = "https://github.com/coleleavitt/kenyon.git", rev = "a6fbb0474071d813b63bb7ea4852e56967e61e32" }

[lints]
workspace = true

[dependencies]
kenyon = { workspace = true }
thiserror = "2"
