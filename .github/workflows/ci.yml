name: ci

on:
  push:
  pull_request:

# rust-toolchain.toml pins the operator's local `rustc-master` build, which CI
# runners don't have; RUSTUP_TOOLCHAIN overrides that file per job.
env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p flyrag --no-deps
      - run: scripts/check_deps.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test -p flyrag
